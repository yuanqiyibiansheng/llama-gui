[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tui"
version = "1.0.0"
description = "LLM 控制台 (llama.cpp) - 终端风格 GUI 推理壳"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.2", "httpx>=0.27"]

[project.scripts]
llm-tui = "llm_tui.__main__:main"

[tool.setuptools.packages.find]
include = ["llm_tui*"]

[tool.setuptools.package-data]
llm_tui = ["config/*.jinja", "assets/*.ico"]
